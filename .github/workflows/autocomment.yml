name: DC upload notifier

on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 minutes (GitHub may delay under load)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a one-off test Telegram message (no upload check)"
        type: boolean
        default: false

permissions:
  contents: write              # needed to commit seen.json back to the repo

concurrency:
  group: dc-upload-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run notifier
        env:
          CHANNEL_ID: UCjemQfjaXAzA-95RKoy9n_g
          SKOOL_LINK: "https://www.skool.com/discovercrypto/about"
          # Fallback comments (partner voice) used only if the AI call fails.
          COMMENT_FALLBACK: "We teach these strategies here - https://www.skool.com/discovercrypto/about"
          COMMENT_FALLBACK_SHORTS: "We teach these strategies here. Tap our channel and hit the top link."
          # Writes the per-video comment in the partner's voice. If unset, the
          # fallbacks above are used instead.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test }}
        run: python poller.py

      - name: Commit updated state
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update state [skip ci]"
            git push
          fi
