name: DC upload notifier

on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 minutes (GitHub may delay under load)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a one-off test Telegram message (no upload check)"
        type: boolean
        default: false

permissions:
  contents: write              # needed to commit seen.json back to the repo

concurrency:
  group: dc-upload-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run notifier
        env:
          CHANNEL_ID: UCjemQfjaXAzA-95RKoy9n_g
          # Long-form / live comments (clickable link). A = warm, B = FOMO.
          COMMENT_TEXT_A: "Tired of guessing and hoping every time you invest? Inside our community you'll get a real system and a group that actually has your back. Come join us 👉 https://www.skool.com/discovercrypto/about"
          COMMENT_TEXT_B: "Stop watching everyone else win while you're stuck guessing. Get the system that takes the fear out of investing and join us inside 👉 https://www.skool.com/discovercrypto/about"
          # Shorts comments (drive to the channel's top link). A = warm, B = FOMO.
          COMMENT_TEXT_SHORTS_A: "Tired of guessing and hoping every time you invest? Tap our channel and hit the top link to get a real system and a community that has your back. 🙌"
          COMMENT_TEXT_SHORTS_B: "Stop watching everyone else win while you're stuck guessing. Tap our channel and hit the top link to get the system that takes the fear out of investing. 🔥"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test }}
        run: python poller.py

      - name: Commit updated state
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update state [skip ci]"
            git push
          fi
